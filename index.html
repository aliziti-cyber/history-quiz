<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>היסטוריה – בוחן (א)</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap');
:root{
  --bg:#F4F3FB; --surface:#FFFFFF; --ink:#23204D; --muted:#6B6890; --line:#E2DFF4;
  --accent:#5B4BDB; --accent-ink:#FFFFFF; --accent-soft:#ECEAFE;
  --good:#18794A; --good-bg:#E2F5EA; --mid:#94600A; --mid-bg:#FFF2D2; --bad:#B8322F; --bad-bg:#FDE6E5;
  --green-btn:#1E9256;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#16152A; --surface:#211F3B; --ink:#EEECFF; --muted:#A8A5CE; --line:#35325C;
    --accent:#8E83FF; --accent-ink:#16152A; --accent-soft:#2C2858;
    --good:#6BDA9B; --good-bg:#173A29; --mid:#F3C559; --mid-bg:#3B3118; --bad:#FF8F8C; --bad-bg:#40201F;
    --green-btn:#2FAE6C;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Assistant","Arial Hebrew",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.narrow{max-width:620px;margin:0 auto}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px;line-height:1.25}
h2{font-size:1.15rem;font-weight:700;margin:0 0 10px}
.sub{color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel+.panel{margin-top:14px}
.frame{border:2px solid var(--accent);border-radius:22px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.green{background:var(--green-btn);border-color:var(--green-btn);color:#fff;font-weight:700}
.btn.blue{background:#2563EB;border-color:#2563EB;color:#fff;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.btn.soft{background:var(--accent-soft);border-color:transparent}
.btn.block{width:100%;padding:16px;font-size:1.05rem;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
label.f{display:block;font-weight:500;margin-bottom:4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;padding:6px}
.center{text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;font-weight:500}
.note{background:var(--mid-bg);color:var(--mid);border-radius:12px;padding:10px 12px;font-size:.92rem}

/* student */
.progress{height:8px;background:var(--accent-soft);border-radius:8px;overflow:hidden;margin:10px 0 18px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 18px}
.listen button{width:112px;height:112px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:2.6rem;position:relative}
.listen button.speaking::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--accent);animation:ring 1.1s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(.92)}to{opacity:0;transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){.listen button.speaking::after{animation:none;opacity:.6}}
.prompt{font-size:1.55rem;font-weight:700;text-align:center;line-height:1.4;margin:0 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 12px;font-size:1.3rem;font-weight:700;justify-content:space-between}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .say{font-size:1.1rem;background:none;border:none;padding:4px;opacity:.7}
.bigInput{font-size:1.6rem!important;text-align:center;padding:16px!important;font-weight:700}
.nav{display:flex;gap:10px;margin-top:22px}
.nav .btn{flex:1;padding:14px}
.review li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.review{list-style:none;margin:0;padding:0}
.done{font-size:3.4rem}
.instr{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-bottom:12px}
.qimg{display:block;max-width:100%;max-height:260px;margin:0 auto 14px;border-radius:10px;background:#fff}
.tscroll{overflow-x:auto;margin:0 0 14px;border-radius:10px;background:#fff}
.timg{display:block;width:100%;min-width:660px;padding:4px}
.prompt.long{font-size:1.2rem}
.opts.one{grid-template-columns:1fr}
.opt .let{display:inline-flex;width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent-soft);align-items:center;justify-content:center;font-size:1rem;margin-left:8px}
.opt.sel .let{background:var(--accent);color:var(--accent-ink)}
.opt .txt{flex:1;text-align:right}
.opts.one .opt{font-size:1.08rem;font-weight:500}
.intro{white-space:pre-line}
.thumb{max-height:90px;max-width:100%;border-radius:8px;background:#fff}
html,body{overflow-x:hidden}
.recbox{border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.recbox .row{margin-top:6px}

/* teacher */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--accent);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:2rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:720px;background:var(--surface)}
th{background:var(--accent-soft);text-align:right;padding:10px;font-weight:700;font-size:.9rem;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.nameBtn{background:none;border:none;font-weight:700;padding:0;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:8px;padding:3px 8px;font-size:.82rem;font-weight:500;white-space:nowrap}
.good{background:var(--good-bg);color:var(--good)}
.mid{background:var(--mid-bg);color:var(--mid)}
.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;min-width:48px;text-align:center;border-radius:10px;padding:4px 8px;font-weight:800;font-size:1.05rem}
.flag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 6px;margin-top:3px;background:var(--mid-bg);color:var(--mid)}
.detail td{background:var(--bg)}
.qa{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 12px;font-size:.9rem;align-items:start}
.qa .h{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.qstat{display:grid;grid-template-columns:1fr 140px 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.partBox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.partBox b{font-size:1.4rem}
.chk{display:inline-flex;gap:6px;align-items:center;padding:8px 10px}

/* editor */
.qcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.qcard+.qcard{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}

/* modal */
.modalBg{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:var(--surface);border-radius:18px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto}

#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.modalBg,.toast{display:none!important}
  #printArea{display:block}
  .pform{page-break-after:always;font-family:Arial,sans-serif;color:#000}
  .pform table{min-width:0;border:1px solid #999}
  .pform td,.pform th{border:1px solid #999;background:#fff;color:#000;padding:6px}
}
</style>
</head>

let DB=null, USER=null, MYID=null, CAN_EDIT=false, lastErr="", subDoc={};
const dbReady=(async()=>{
  try{ if(window.claude && claude.use){
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]); DB=d; USER=u;
    if(USER){ try{ MYID=await USER.id(); }catch(e){} try{ CAN_EDIT=!!(await USER.canEdit()); }catch(e){} }
  } }catch(e){ console.error(e); }
})();
function storageOK(){ return !!DB; }
function errText(e){ const c=e&&e.code;
  return c==="invalid_argument"?"אין הרשאת שמירה בקישור הזה":c==="quota_exceeded"?"נגמר המקום באחסון":c==="resource_exhausted"?"יותר מדי פעולות, נסו שוב בעוד רגע":(e&&e.message)||String(e); }
const lget=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lset=k=>v=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const CH=180000;
async function sget(k, sh){
  if(!sh) return lget(k);
  if(!DB) return null;
  try{
    if(k==="quiz-config"){ const d=await DB.doc("config/main").get(); return d.exists?d.data().json:null; }
    if(k.startsWith("note:")){ const d=await DB.doc("notes/"+k.slice(5)).get(); return d.exists?d.data().text:null; }
    if(k.startsWith("audio:")){ const id=k.slice(6); const h=await DB.doc("audio/"+id).get(); if(!h.exists) return null;
      const n=h.data().n; const parts=await Promise.all(Array.from({length:n},(_,i)=>DB.doc(`audio/${id}/parts/${i}`).get()));
      if(parts.some(x=>!x.exists)) return null; return parts.map(x=>x.data().d).join(""); }
  }catch(e){ console.error(e); }
  return null;
}
async function sset(k, v, sh){
  if(!sh) return lset(k)(v);
  await dbReady;
  if(!DB){ lastErr="צריך להיות מחוברים לחשבון Claude"; return false; }
  try{
    if(k==="quiz-config"){ if(v.length>250000){ lastErr="המבדק גדול מדי, נסו להסיר תמונות"; return false; } await DB.doc("config/main").set({json:v}); return true; }
    if(k.startsWith("note:")){ await DB.doc("notes/"+k.slice(5)).set({text:v}); return true; }
    if(k.startsWith("audio:")){ const id=k.slice(6); const n=Math.ceil(v.length/CH);
      for(let i=0;i<n;i++) await DB.doc(`audio/${id}/parts/${i}`).set({d:v.slice(i*CH,(i+1)*CH)});
      await DB.doc("audio/"+id).set({n}); return true; }
    if(k.startsWith("sub:")){ if(!MYID){ lastErr="צריך להיות מחוברים לחשבון Claude"; return false; }
      const ref=DB.doc("subs/"+MYID); const cur=await ref.get(); const items={...((cur.exists&&cur.data().items)||{})};
      items[k.slice(4)]=JSON.parse(v); await ref.set({items}); return true; }
  }catch(e){ console.error(e); lastErr=errText(e); return false; }
  lastErr="מפתח לא מוכר"; return false;
}
async function sdel(k, sh){
  if(!sh){ try{ localStorage.removeItem(k); }catch(e){} return true; }
  if(!DB) return false;
  try{
    if(k.startsWith("note:")){ await DB.doc("notes/"+k.slice(5)).delete(); return true; }
    if(k.startsWith("audio:")){ const id=k.slice(6); const h=await DB.doc("audio/"+id).get(); await DB.doc("audio/"+id).delete();
      if(h.exists) for(let i=0;i<h.data().n;i++) await DB.doc(`audio/${id}/parts/${i}`).delete(); return true; }
    if(k.startsWith("sub:")){ const sid=k.slice(4), docId=subDoc[sid]; if(!docId) return false;
      const ref=DB.doc("subs/"+docId); const cur=await ref.get(); if(!cur.exists) return true;
      const items={...(cur.data().items||{})}; delete items[sid];
      if(Object.keys(items).length) await ref.set({items}); else await ref.delete(); delete subDoc[sid]; return true; }
  }catch(e){ console.error(e); lastErr=errText(e); }
  return false;
}
async function slist(p, sh){
  if(!sh||!DB) return [];
  try{
    if(p==="audio:"){ const q=await DB.collection("audio").get(); return q.docs.map(d=>"audio:"+d.id); }
    if(p==="sub:"){ const q=await DB.collection("subs").get(); subDoc={};
      q.docs.forEach(d=>Object.keys((d.data().items)||{}).forEach(sid=>{ subDoc[sid]=d.id; })); return Object.keys(subDoc).map(x=>"sub:"+x); }
  }catch(e){ console.error(e); }
  return [];
}
async function loadAllSubs(){
  if(!DB) return [];
  const q=await DB.collection("subs").get(); subDoc={}; const out=[];
  q.docs.forEach(d=>Object.entries((d.data().items)||{}).forEach(([sid,sub])=>{ subDoc[sid]=d.id; out.push(sub); }));
  return out;
}

let DL=null;
async function saveFile(blob, name){
  if(DL===null){ try{ DL=(window.claude&&claude.use)?await claude.use("downloads"):false; }catch(e){ DL=false; } }
  if(DL){ try{ await DL.save({filename:name,data:blob}); return true; }
    catch(e){ if(e&&e.code==="declined") return false; toast("ההורדה לא הצליחה ("+((e&&e.code)||"")+")"); return false; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); return true;
}

function defImgs(){ const m={}; DEFAULT_CONFIG.parts.forEach((p,pi)=>{ if(p.img) m["p"+pi]=p.img; p.questions.forEach(q=>{ if(q.img) m[q.id]=q.img; }); }); return m; }
function packConfig(c){ const m=defImgs(), o=clone(c); o.parts.forEach((p,pi)=>{ if(p.img&&p.img===m["p"+pi]) p.img="@def"; p.questions.forEach(q=>{ if(q.img&&q.img===m[q.id]) q.img="@def"; }); }); return o; }
function unpackConfig(o){ const m=defImgs(); o.parts.forEach((p,pi)=>{ if(p.img==="@def") p.img=m["p"+pi]||""; p.questions.forEach(q=>{ if(q.img==="@def") q.img=m[q.id]||""; }); }); return o; }

const app = document.getElementById("app");

function norm(s){ return String(s??"").replace(/[\u0591-\u05C7]/g,"").replace(/[?!.,"'״׳:;\-–]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function allQuestions(){ const out=[]; config.parts.forEach((p,pi)=>p.questions.forEach((q,qi)=>out.push({...q, partName:p.name, partInstr:p.instructions||"", partInstrSpeak:p.instrSpeak||"", partImg:p.img||"", first:qi===0, pi}))); return out; }
function isCorrect(q,a){
  if(!hasAns(a)) return false;
  if(q.type==="multi"){ const x=[...a].map(Number).sort().join(","), y=[...q.answer].map(Number).sort().join(","); return x===y; }
  if(q.type==="mc") return Number(a)===Number(q.answer);
  if(q.type==="tf") return String(a)===String(q.answer);
  return String(q.answer).split("|").map(norm).filter(Boolean).includes(norm(a));
}
function grade(sub){
  let pts=0,tot=0,correct=0,n=0;
  const parts=config.parts.map(p=>{ let got=0,max=0;
    p.questions.forEach(q=>{ const w=Number(q.points)||0; max+=w; n++; if(isCorrect(q,sub.answers[q.id])){ got+=w; correct++; } });
    pts+=got; tot+=max; return {name:p.name,got,max}; });
  const bonus=Number(config.bonus)||0;
  return {parts,pts,tot,correct,n,score: tot?Math.min(100,Math.round((pts+bonus)/(tot+bonus)*100)):0};
}
function answerText(q,a){
  if(!hasAns(a)) return "—";
  if(q.type==="multi") return [...a].map(Number).sort().map(i=>LET[i]+". "+q.options[i]).join("; ");
  if(q.type==="mc") return q.options[a]!==undefined ? LET[a]+". "+q.options[a] : "—";
  if(q.type==="tf") return String(a)==="true"?"נכון":"לא נכון";
  return a;
}
function correctText(q){
  if(q.type==="multi") return [...q.answer].map(Number).sort().map(i=>LET[i]+". "+q.options[i]).join("; ");
  if(q.type==="mc") return q.options[q.answer]!==undefined ? LET[q.answer]+". "+q.options[q.answer] : "";
  if(q.type==="tf") return String(q.answer)==="true"?"נכון":"לא נכון";
  return String(q.answer).split("|").join(" / ");
}
function displayPrompt(q){ return q.type==="dict" ? (q.prompt || "כתבו את המילה ששמעתם") : q.prompt; }
function optSay(q,k){ return (q.optSpeak&&q.optSpeak[k]) || q.options[k]; }
function speakText(q){
  const pre = (q.first && q.partInstr) ? q.partInstr.replace(/\(.*?\)/g,"") + " ... " : "";
  const base = (q.speak || q.prompt || "").replace(/_{2,}/g," ... ");
  if(q.type==="dict"){ const w=String(q.answer).split("|")[0]; return pre + (q.speak || `כתבו את המילה: ${w}. ... ${w}.`); }
  if(q.type==="mc"||q.type==="multi") return pre + base + " ... " + q.options.map((o,k)=>LET[k]+": "+optSay(q,k)+".").join(" ");
  if(q.type==="tf") return pre + base + ". נכון, או לא נכון?";
  return pre + base;
}
const lvl = r => r>=1 ? "good" : r>=0.5 ? "mid" : "bad";
const scoreLvl = s => s>=85 ? "good" : s>=60 ? "mid" : "bad";
const fmtTime = ts => { const d=new Date(ts); return d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})+" "+d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}); };

let heVoice=null, speechWorked=false, speechTried=false;
let heVoices=[], voiceChosen=false;
function vscore(v){ let s=0; const n=v.name||""; if(/natural|neural|online|premium|enhanced|wavenet|studio/i.test(n)) s+=6; if(/google/i.test(n)) s+=3; if(!v.localService) s+=2; return s; }
function pickVoice(){ if(!("speechSynthesis" in window)) return; const vs=speechSynthesis.getVoices();
  heVoices=vs.filter(v=>/^(he|iw)/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a));
  if(!voiceChosen || !heVoices.includes(heVoice)) heVoice=heVoices[0]||null; refreshVoicePicker(); }
function refreshVoicePicker(){
  const box=document.getElementById("voiceBox"); if(!box) return;
  if(heVoices.length<2){ box.innerHTML=""; return; }
  box.innerHTML=`<label class="f" for="voicePick">קול ההקראה (אפשר לבחור את הקול הנעים ביותר)</label><div class="row"><select id="voicePick" style="flex:1">${heVoices.map((v,i)=>`<option value="${i}" ${v===heVoice?"selected":""}>${esc(v.name)}</option>`).join("")}</select><button class="btn" id="voiceTest">🔊 ניסיון</button></div>`;
  document.getElementById("voicePick").onchange=e=>{ heVoice=heVoices[Number(e.target.value)]; voiceChosen=true; };
  const t=document.getElementById("voiceTest"); t.onclick=()=>speak("שלום! ככה תשמעו את השאלות במבחן.",t);
}

let audioIds=new Set(), audioCache={}, curAudio=null, rec=null, recId=null, recChunks=[];
const partIdOf=(p,pi)=>p.id||("p"+pi);
function stopAll(){ if("speechSynthesis" in window) speechSynthesis.cancel(); if(curAudio){ curAudio.pause(); curAudio=null; } document.querySelectorAll(".speaking").forEach(b=>b.classList.remove("speaking")); }
async function loadAudioIndex(){ const ks=await slist("audio:",true); audioIds=new Set(ks.map(k=>k.slice(6))); }
async function getAudio(id){ if(audioCache[id]) return audioCache[id]; const v=await sget("audio:"+id,true); if(v) audioCache[id]=v; return v; }
function playURL(url, btn, onDone){
  stopAll(); const a=new Audio(url); curAudio=a; speechTried=true;
  if(btn) btn.classList.add("speaking");
  a.onplay=()=>{ speechWorked=true; };
  a.onended=()=>{ if(btn) btn.classList.remove("speaking"); if(curAudio===a){ curAudio=null; if(onDone) onDone(); } };
  a.onerror=()=>{ if(btn) btn.classList.remove("speaking"); };
  a.play().catch(()=>{ if(btn) btn.classList.remove("speaking"); });
}
async function sayItem(id, text, btn, onDone){
  if(audioIds.has(id)){ const u=await getAudio(id); if(u){ playURL(u,btn,onDone); return; } }
  speak(text,btn,onDone);
}
function readQuestion(q, btn){
  const qText=speakText({...q, first:false});
  if(q.first && q.partInstr) sayItem(partIdOf(config.parts[q.pi],q.pi), q.partInstrSpeak || q.partInstr.replace(/\(.*?\)/g,""), btn, ()=>sayItem(q.id,qText,btn));
  else sayItem(q.id,qText,btn);
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function introSpeech(){
  if(typeof config.introSpeak==="string" && config.introSpeak.trim()) return config.introSpeak;
  if(config.introSpeak===undefined && config.intro===DEFAULT_CONFIG.intro) return DEFAULT_CONFIG.introSpeak;
  return config.intro||"";
}
function pronList(){ const src = (config && typeof config.pron==="string") ? config.pron : (DEFAULT_CONFIG.pron||"");
  return src.split("\n").map(l=>l.split("=")).filter(x=>x.length>=2&&x[0].trim()&&x[1].trim()).map(([k,...v])=>[k.trim(),v.join("=").trim()]).sort((a,b)=>b[0].length-a[0].length); }
function fixPron(text){
  let t=String(text);
  for(const [k,v] of pronList()){
    const re=new RegExp("(^|[^\u05D0-\u05EA\u0591-\u05C7])([ובהלמכש]?)"+k.replace(/[.*+?^${}()|[\]\\"]/g,m=>m==='"'?'["״]':"\\"+m)+"(?=[^\u05D0-\u05EA\u0591-\u05C7]|$)","g");
    t=t.replace(re,(m,a,b)=>a+b+v);
  }
  return t;
}
function speak(text, btn, onDone){
  text=fixPron(String(text).replace(/[:;]-?\)+|\(+-?[:;]/g,""));
  if(!("speechSynthesis" in window)){ toast("המכשיר הזה לא תומך בהקראה"); return; }
  stopAll();
  const u=new SpeechSynthesisUtterance(text); u.lang="he-IL"; if(heVoice) u.voice=heVoice; u.rate=Number(config.rate)||0.95; u.pitch=1;
  u.onstart=()=>{ speechWorked=true; const w=document.getElementById("voiceWarn"); if(w) w.remove(); };
  if(btn) btn.classList.add("speaking");
  u.onend=()=>{ if(btn) btn.classList.remove("speaking"); if(onDone) onDone(); };
  u.onerror=()=>{ if(btn) btn.classList.remove("speaking"); };
  speechTried=true;
  speechSynthesis.speak(u);
  setTimeout(()=>{ if(st && !speechWorked && !document.getElementById("voiceWarn")){ const n=document.createElement("div"); n.id="voiceWarn"; n.className="note"; n.style.marginTop="12px";
    n.textContent="לא שומעים הקראה? בדקו שהשמע בטלפון פתוח ושאינו במצב שקט. אם עדיין אין קול, אפשר לקרוא את השאלות בעצמכם."; const t=app.querySelector(".panel"); if(t) t.prepend(n); } },3500);
}

function renderQuestion(){
  const q=st.flat[st.i], n=st.flat.length, a=st.answers[q.id];
  let ui="";
  if(q.type==="mc"||q.type==="multi"){
    const isSel=k=> q.type==="multi" ? Array.isArray(a)&&a.includes(k) : String(a)===String(k);

    ui=`${q.type==="multi"?`<p class="sub center">אפשר לבחור יותר מתשובה אחת</p>`:""}<div class="opts ${longOpts?"one":""}">${q.options.map((o,k)=>`<div class="opt ${isSel(k)?"sel":""}" role="${q.type==="multi"?"checkbox":"button"}" aria-checked="${isSel(k)}" tabindex="0" data-pick="${k}"><span class="let">${q.type==="multi"&&isSel(k)?"✓":LET[k]}</span><span class="txt">${esc(o)}</span><button class="say" aria-label="השמעת התשובה" data-say="${k}">🔊</button></div>`).join("")}</div>`;
  }else if(q.type==="tf"){
    ui=`<div class="opts"><div class="opt ${a==="true"?"sel":""}" role="button" tabindex="0" data-pick="true"><span>✔ נכון</span></div><div class="opt ${a==="false"?"sel":""}" role="button" tabindex="0" data-pick="false"><span>✘ לא נכון</span></div></div>`;
  }else{
    ui=`<input id="ans" class="bigInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a??"")}" placeholder="כתבו כאן">`;
  }
  app.innerHTML=`<div class="narrow panel frame">
    <div class="row" style="justify-content:space-between"><b>${esc(q.partName)}</b><span class="sub">שאלה ${st.i+1} מתוך ${n}</span></div>
    <div class="progress"><i style="width:${(st.i)/n*100}%"></i></div>
    <div class="listen"><button id="hear" aria-label="השמעת השאלה">🔊</button><span class="sub">לחצו כדי לשמוע שוב</span></div>

    ${displayPrompt(q)?`<p class="prompt ${displayPrompt(q).length>40?"long":""}">${esc(displayPrompt(q))}</p>`:""}

    <div class="nav"><button class="btn" id="prev" ${st.i===0?"disabled":""}>הקודם</button><button class="btn primary" id="next">${st.i===n-1?"לסיכום":"הבא"}</button></div>
  </div>`;
  const hear=document.getElementById("hear");
  hear.onclick=()=>readQuestion(q,hear);
  const nq=st.flat[st.i+1]; if(nq && audioIds.has(nq.id)) getAudio(nq.id);
  app.querySelectorAll("[data-pick]").forEach(el=>{
    const pick=()=>{
      if(q.type==="multi"){ const k=Number(el.dataset.pick); let arr=Array.isArray(st.answers[q.id])?[...st.answers[q.id]]:[];
        arr = arr.includes(k) ? arr.filter(x=>x!==k) : [...arr,k]; st.answers[q.id]=arr;
        const on=arr.includes(k); el.classList.toggle("sel",on); el.setAttribute("aria-checked",on); el.querySelector(".let").textContent=on?"✓":LET[k]; return; }
      st.answers[q.id]=el.dataset.pick; app.querySelectorAll("[data-pick]").forEach(x=>x.classList.toggle("sel",x===el)); };
    el.onclick=e=>{ if(e.target.closest("[data-say]")) return; pick(); };

}

function renderDash(){
  const qs=allQuestions();
  const graded=subs.map(s=>({s,g:grade(s)}));
  const scores=graded.map(x=>x.g.score);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):"—";
  const hi=scores.length?Math.max(...scores):"—", lo=scores.length?Math.min(...scores):"—";
  const nameCount={}; subs.forEach(s=>{ const k=norm(s.name); nameCount[k]=(nameCount[k]||0)+1; });

  const partAvg=config.parts.map((p,pi)=>{ const got=graded.reduce((a,x)=>a+x.g.parts[pi].got,0), max=graded.reduce((a,x)=>a+x.g.parts[pi].max,0); return {name:p.name, r:max?got/max:0}; });
  const qAvg=qs.map(q=>({q, r: subs.length? subs.filter(s=>isCorrect(q,s.answers[q.id])).length/subs.length : 0}));

  const rows=graded.map(({s,g})=>{

  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${canvases.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] >>`));

    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(iid,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`); push(img); push("\nendstream"); });

async function printForms(list){
  if(!list.length){ toast("אין טפסים להדפסה"); return; }
  const name = safeName(list.length===1 ? `טופס - ${list[0].name}` : `${config.title} - כל הטפסים`);
  const wait=document.createElement("div"); wait.className="toast"; wait.textContent="מכין קובץ PDF…"; document.body.appendChild(wait);
  try{
    await new Promise(r=>setTimeout(r,30));
    const notes={}; await Promise.all(list.map(async x=>{ notes[x.id]=(await sget("note:"+x.id,true))||""; }));
    const blob=buildPdf(await drawForms(list,notes)); wait.remove();
    if(await saveFile(blob, name+".pdf")) toast("קובץ ה-PDF ירד. אפשר לפתוח ולהדפיס אותו");
  }catch(e){
    console.error(e); wait.remove();
    const html=`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>${esc(name)}</title><style>body{margin:16px;background:#fff}.pform{font-family:Arial,sans-serif;color:#000}.pform table{border-collapse:collapse;width:100%}.pform td,.pform th{border:1px solid #999;padding:5px;text-align:right}.pform{width:auto;page-break-after:always}</style></head><body>${list.map(formHTML).join("")}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
    triggerDownload(new Blob([html],{type:"text/html;charset=utf-8"}), name+".html");
    toast("ירד קובץ להדפסה. פתחו אותו, והוא ייפתח ישר בחלון ההדפסה");
  }
}
function exportCSV(){
  if(!subs.length){ toast("אין עדיין תוצאות להורדה"); return; }
  const qs=allQuestions();
  const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["שם","כיתה","זמן הגשה","ציון","תשובות נכונות",...config.parts.map((p,i)=>`חלק ${i+1}: ${p.name}`),...qs.map((q,i)=>`שאלה ${i+1}`)];
  const lines=[head.map(cell).join(",")];
  subs.forEach(s=>{ const g=grade(s);
    lines.push([s.name,s.cls,fmtTime(s.ts),g.score,`${g.correct}/${g.n}`,...g.parts.map(p=>`${p.got}/${p.max}`),
      ...qs.map(q=>`${answerText(q,s.answers[q.id])} ${isCorrect(q,s.answers[q.id])?"✓":"✗"}`)].map(cell).join(","));
  });
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  saveFile(blob,`${config.title}.csv`).then(ok=>{ if(ok) toast("הקובץ ירד. אפשר לפתוח אותו באקסל"); });
}

/* ================= עריכה ================= */
async function editor(){
  stopAuto(); draft=clone(config); draft.parts.forEach((p,pi)=>{ if(!p.id) p.id="p"+pi; }); await loadAudioIndex(); renderEditor();
}
function audioCtl(id,label){
  const has=audioIds.has(id);
  return `<div class="recbox"><div class="sub">${label} ${has?"<b>מוקלט בקולך ✓</b>":"(עכשיו: קול ממוחשב)"}</div><div class="row">
    <button class="btn" data-arec="${id}">🎙 ${has?"הקלטה מחדש":"הקלטה בקולי"}</button>
    <label class="btn">⬆ קובץ שמע<input type="file" accept="audio/*" hidden data-aup="${id}"></label>
    ${has?`<button class="btn" data-aplay="${id}">▶ השמעה</button><button class="btn danger" data-adel="${id}">מחיקה</button>`:""}</div></div>`;
}
function blobToURL(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
function rerenderKeep(){ const y=window.scrollY; renderEditor(); window.scrollTo(0,y); }
async function storeAudio(id, blob){
  if(blob.size>3.5*1024*1024){ toast("הקובץ גדול מדי. נסו הקלטה קצרה יותר, עד דקה בערך."); return; }
  const url=await blobToURL(blob);
  if(await sset("audio:"+id,url,true)){ audioIds.add(id); audioCache[id]=url; toast("ההקלטה נשמרה"); } else toast("שמירת ההקלטה נכשלה ("+lastErr+")");
  rerenderKeep();
}
async function toggleRec(id, btn){
  if(rec){ if(recId===id) rec.stop(); else toast("קודם עצרו את ההקלטה הנוכחית"); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("אין כאן גישה למיקרופון. הקליטו באפליקציית ההקלטות של הטלפון והעלו את הקובץ עם ⬆"); return; }
  const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
  try{ rec=new MediaRecorder(stream, mt?{mimeType:mt,audioBitsPerSecond:48000}:{}); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); toast("ההקלטה לא נתמכת כאן. אפשר להעלות קובץ שמע עם ⬆"); return; }
  recChunks=[]; recId=id;
  rec.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
  rec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); const type=rec.mimeType||mt||"audio/webm"; rec=null; recId=null; await storeAudio(id,new Blob(recChunks,{type})); };
  stopAll(); rec.start(); btn.textContent="⏹ עצירה ושמירה"; btn.classList.add("danger","speaking");
  setTimeout(()=>{ if(rec && recId===id) rec.stop(); },90000);
}
function setPath(obj,path,val){ const ks=path.split("."); let o=obj; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]]=val; }
function renderEditor(){
  const qEditor=(q,pi,qi)=>{
    const base=`parts.${pi}.questions.${qi}`;
    let ans="";
    if(q.type==="multi") ans=`<div><label class="f">אפשרויות (כל אחת בשורה)</label><textarea data-k="${base}.options" data-lines>${esc(q.options.join("\n"))}</textarea></div>
      <div><label class="f">התשובות הנכונות</label>${q.options.map((o,k)=>`<label class="chk" style="display:flex"><input type="checkbox" data-multi="${pi}.${qi}.${k}" ${q.answer.map(Number).includes(k)?"checked":""}> ${LET[k]}. ${esc(o)}</label>`).join("")}</div>`;
    else if(q.type==="mc") ans=`<div><label class="f">אפשרויות (כל אחת בשורה)</label><textarea data-k="${base}.options" data-lines>${esc(q.options.join("\n"))}</textarea></div>
      <div><label class="f">התשובה הנכונה</label><select data-k="${base}.answer" data-num>${q.options.map((o,k)=>`<option value="${k}" ${Number(q.answer)===k?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    else if(q.type==="tf") ans=`<div><label class="f">התשובה הנכונה</label><select data-k="${base}.answer"><option value="true" ${q.answer==="true"?"selected":""}>נכון</option><option value="false" ${q.answer==="false"?"selected":""}>לא נכון</option></select></div>`;
    else ans=`<div><label class="f">${q.type==="dict"?"המילה להכתבה":"תשובה נכונה"} <span class="sub">(כמה אפשרויות? הפרידו ב-|)</span></label><input type="text" data-k="${base}.answer" value="${esc(q.answer)}"></div>`;
    return `<div class="qcard stack">
      <div class="row" style="justify-content:space-between"><b>שאלה ${qi+1}</b><div class="row">
        <button class="btn" data-act="testq" data-pi="${pi}" data-qi="${qi}" aria-label="השמעה">🔊</button>
        <button class="btn" data-act="up" data-pi="${pi}" data-qi="${qi}" aria-label="הזזה למעלה">▲</button>
        <button class="btn danger" data-act="delq" data-pi="${pi}" data-qi="${qi}">מחיקה</button></div></div>
      <div class="grid2">
        <div><label class="f">סוג</label><select data-k="${base}.type" data-retype>${Object.entries(TYPE_NAMES).map(([k,v])=>`<option value="${k}" ${q.type===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div><label class="f">נקודות</label><input type="number" min="0" data-k="${base}.points" data-num value="${esc(q.points)}"></div>
      </div>
      <div><label class="f">${q.type==="dict"?"טקסט על המסך (לא חובה)":"השאלה על המסך"}</label><input type="text" data-k="${base}.prompt" value="${esc(q.prompt)}"></div>
      <div><label class="f">מה להקריא <span class="sub">(אפשר עם ניקוד. ריק = מקריא את השאלה)</span></label><input type="text" data-k="${base}.speak" value="${esc(q.speak)}"></div>
      ${ans}
      ${audioCtl(q.id,"הקראת השאלה (כדאי להקריא גם את התשובות):")}
      <div class="row">${q.img?`<img class="thumb" src="${q.img}" alt=""><button class="btn danger" data-act="delimg" data-pi="${pi}" data-qi="${qi}">הסרת התמונה</button>`:""}
        <label class="btn">🖼 ${q.img?"החלפת תמונה":"הוספת תמונה"}<input type="file" accept="image/*" hidden data-img="${pi}.${qi}"></label></div>
      </div>`;
  };
  app.innerHTML=`<div class="narrow stack">
    <div class="topbar"><h1>✏️ עריכת המבדק</h1><div class="row"><button class="btn primary" id="save">שמירת השינויים</button><button class="btn" id="cancel">ביטול</button></div></div>
    <div class="note">שינוי שאלות או תשובות אחרי שתלמידים כבר הגישו משנה גם את הציונים שלהם בעמוד המורה.</div>
    <div class="panel stack">
      <div class="grid2"><div><label class="f">שם המבדק</label><input type="text" data-k="title" value="${esc(draft.title)}"></div>
        <div><label class="f">תאריך</label><input type="text" data-k="date" value="${esc(draft.date)}"></div></div>
      <div class="grid2"><div><label class="f">קוד מורה</label><input type="text" data-k="pin" value="${esc(draft.pin)}"></div>
        <div><label class="f">מהירות הקראה</label><select data-k="rate" data-num>${[[0.8,"איטית"],[0.9,"מעט איטית"],[0.95,"טבעית"],[1,"רגילה"]].map(([v,l])=>`<option value="${v}" ${Number(draft.rate)===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
      <div class="grid2"><div><label class="f">נקודות מתנה</label><input type="number" min="0" data-k="bonus" data-num value="${esc(draft.bonus||0)}"></div></div>
      <div><label class="f">דברי פתיחה לתלמידים</label><textarea data-k="intro">${esc(draft.intro||"")}</textarea></div>
      <div><label class="f">נוסח מנוקד להקראה <span class="sub">(לא חובה. אם ממלאים, זה מה שיוקרא במקום דברי הפתיחה)</span></label><textarea data-k="introSpeak">${esc(typeof draft.introSpeak==="string"?draft.introSpeak:(draft.intro===DEFAULT_CONFIG.intro?DEFAULT_CONFIG.introSpeak:""))}</textarea></div>
      ${audioCtl("intro","הקראת דברי הפתיחה:")}
      <div><label class="f">תיקוני הגייה <span class="sub">(בכל שורה: מילה=איך להקריא אותה, עם ניקוד)</span></label><textarea data-k="pron" style="min-height:150px">${esc(typeof draft.pron==="string"?draft.pron:(DEFAULT_CONFIG.pron||""))}</textarea>
        <div class="row" style="margin-top:6px"><input type="text" id="pronTry" placeholder="כתבו משפט לבדיקה" style="flex:1"><button class="btn" id="pronTest">🔊 בדיקה</button></div></div>
      <label class="chk"><input type="checkbox" data-k="autoRead" data-bool ${draft.autoRead?"checked":""}> הקראה אוטומטית של כל שאלה</label>
      <label class="chk"><input type="checkbox" data-k="showScore" data-bool ${draft.showScore?"checked":""}> להראות לתלמיד את הציון אחרי ההגשה</label>
    </div>
    ${draft.parts.map((p,pi)=>`<div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">חלק ${pi+1}</h2><button class="btn danger" data-act="delp" data-pi="${pi}">מחיקת החלק</button></div>
      <div><label class="f">שם החלק</label><input type="text" data-k="parts.${pi}.name" value="${esc(p.name)}"></div>
      <div><label class="f">הוראות לחלק (מוצגות ומוקראות)</label><textarea data-k="parts.${pi}.instructions">${esc(p.instructions||"")}</textarea></div>
      <div><label class="f">נוסח מנוקד להקראת ההוראות <span class="sub">(לא חובה)</span></label><textarea data-k="parts.${pi}.instrSpeak">${esc(p.instrSpeak||"")}</textarea></div>
      ${audioCtl(partIdOf(p,pi),"הקראת ההוראות של החלק:")}
      <div class="row">${p.img?`<img class="thumb" src="${p.img}" alt=""><button class="btn danger" data-act="delpimg" data-pi="${pi}">הסרת התמונה</button>`:""}
        <label class="btn">🖼 ${p.img?"החלפת תמונת החלק":"תמונה לכל שאלות החלק"}<input type="file" accept="image/*" hidden data-img="${pi}"></label></div>
      ${p.questions.map((q,qi)=>qEditor(q,pi,qi)).join("")}
      <button class="btn soft" data-act="addq" data-pi="${pi}">+ הוספת שאלה</button></div>`).join("")}
    <button class="btn soft block" data-act="addp">+ הוספת חלק</button>
  </div>`;

  app.querySelectorAll("[data-k]").forEach(el=>{
    const handler=()=>{
      let v = el.hasAttribute("data-bool") ? el.checked : el.value;
      if(el.hasAttribute("data-num")) v=Number(v);
      if(el.hasAttribute("data-lines")){ v=el.value.split("\n").map(s=>s.trim()).filter(Boolean);
        const [,pi,,qi]=el.dataset.k.split("."); const q=draft.parts[pi].questions[qi]; delete q.optSpeak;
        if(q.type==="multi") q.answer=q.answer.filter(i=>i<v.length); else if(Number(q.answer)>=v.length) q.answer=0; }
      setPath(draft,el.dataset.k,v);
    };
    el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"?"change":"input",handler);
    if(el.hasAttribute("data-lines")) el.addEventListener("blur",()=>{ const y=window.scrollY; renderEditor(); window.scrollTo(0,y); });
    if(el.hasAttribute("data-retype")) el.addEventListener("change",()=>{
      const [,pi,,qi]=el.dataset.k.split("."); const q=draft.parts[pi].questions[qi];
      delete q.optSpeak;
      if(q.type==="mc"||q.type==="multi"){ q.options=q.options&&q.options.length?q.options:["אפשרות 1","אפשרות 2"]; q.answer=q.type==="multi"?[0]:0; }
      else if(q.type==="tf") q.answer="true"; else q.answer="";
      const y=window.scrollY; renderEditor(); window.scrollTo(0,y);
    });
  });
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const pi=Number(b.dataset.pi), qi=Number(b.dataset.qi), a=b.dataset.act, y=window.scrollY;
    if(a==="addq") draft.parts[pi].questions.push({id:uid(),type:"mc",prompt:"",speak:"",options:["אפשרות 1","אפשרות 2","אפשרות 3"],answer:0,points:5,img:""});
    if(a==="delq") draft.parts[pi].questions.splice(qi,1);
    if(a==="up" && qi>0){ const qs=draft.parts[pi].questions; [qs[qi-1],qs[qi]]=[qs[qi],qs[qi-1]]; }
    if(a==="addp") draft.parts.push({id:uid(),name:"חלק חדש",questions:[]});
    if(a==="delp") draft.parts.splice(pi,1);
    if(a==="delimg") draft.parts[pi].questions[qi].img="";
    if(a==="delpimg") draft.parts[pi].img="";
    if(a==="testq"){ const q=draft.parts[pi].questions[qi]; speak(speakText(q),b); return; }
    renderEditor(); window.scrollTo(0,y);
  });
  app.querySelectorAll("[data-arec]").forEach(b=>b.onclick=()=>toggleRec(b.dataset.arec,b));
  app.querySelectorAll("[data-aplay]").forEach(b=>b.onclick=async()=>{ const u=await getAudio(b.dataset.aplay); if(u) playURL(u,b); });
  app.querySelectorAll("[data-adel]").forEach(b=>b.onclick=async()=>{ if(!await askConfirm("למחוק את ההקלטה? במקומה יחזור הקול הממוחשב.","מחיקה",true)) return;
    const id=b.dataset.adel; await sdel("audio:"+id,true); audioIds.delete(id); delete audioCache[id]; toast("ההקלטה נמחקה"); rerenderKeep(); });
  app.querySelectorAll("[data-aup]").forEach(inp=>inp.onchange=async()=>{ const f=inp.files[0]; if(f) await storeAudio(inp.dataset.aup,f); });
  app.querySelectorAll("[data-multi]").forEach(c=>c.onchange=()=>{
    const [pi,qi,k]=c.dataset.multi.split(".").map(Number); const q=draft.parts[pi].questions[qi];
    q.answer = c.checked ? [...new Set([...q.answer.map(Number),k])] : q.answer.map(Number).filter(x=>x!==k);
  });
  app.querySelectorAll("[data-img]").forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return; const url=await shrinkImage(f);
    const [pi,qi]=inp.dataset.img.split(".");
    if(qi===undefined) draft.parts[pi].img=url; else draft.parts[pi].questions[qi].img=url;
    const y=window.scrollY; renderEditor(); window.scrollTo(0,y);
  });
  const pt=document.getElementById("pronTest"); if(pt) pt.onclick=()=>{ const old=config.pron; config.pron=draft.pron; speak(document.getElementById("pronTry").value||"מבחן ובוחן",pt); config.pron=old; };
  document.getElementById("save").onclick=async()=>{
    if(!String(draft.pin).trim()){ toast("צריך קוד מורה"); return; }
    config=clone(draft); if(await saveConfig()) teacherHome();
  };
  document.getElementById("cancel").onclick=teacherHome;
}

function shrinkImage(file){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const m=600, sc=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement("canvas");
    c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); const x=c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.75)); };
    im.src=r.result; }; r.readAsDataURL(file); });
}
